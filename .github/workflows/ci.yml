name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these workflows only need to read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      # Actions are pinned to a full commit SHA (version noted in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # The tool descriptions are pinned; this fails if they changed without a deliberate --update.
      - run: python -m hardened_mcp.manifest
      - run: pip-audit

  # Breaks each security control in turn and requires the test suite to notice. Slower (about a minute),
  # so it is its own job; make it a required check once you have watched it for a while.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements-dev.txt
      - run: python tools/mutation_check.py --jobs 4

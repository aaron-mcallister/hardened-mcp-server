[project]
name = "hardened-mcp-server"
version = "0.1.0"
description = "A reference MCP server where every security control is a tested, spec-mapped behaviour."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27", "ruff>=0.17", "pip-audit>=2.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hardened_mcp"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC"]
ignore = ["S104"]  # binding is decided by configuration and defaults to loopback

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "E501"]
"tools/mutation_check.py" = ["E501", "S603"]  # the mutation table is data; it runs a fixed command

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:hardened_mcp"]
